<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps Hackathon - Đề 006</title>
    <style>
      :root {
        --bg: #f4f6f9;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #4b5563;
        --accent: #eb5d2f;
        --accent-dark: #c4461b;
        --border: #dfe4ea;
        --header: #0d1f2d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .topbar {
        background: var(--header);
        color: white;
        padding: 16px 24px;
        border-radius: 10px 10px 0 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .topbar .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 1.1rem;
        font-weight: 600;
      }

      .topbar .brand::before {
        content: "←";
        font-size: 20px;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-top: none;
        padding: 26px 28px;
      }

      h1 {
        margin: 0 0 26px;
        font-size: clamp(2rem, 3vw, 3rem);
        font-weight: 700;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(250px, 1fr));
        border: 1px solid var(--border);
      }

      .info-grid .row {
        display: contents;
      }

      .info-grid .cell {
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }

      .info-grid .cell:nth-child(odd) {
        font-weight: 700;
        background: rgba(0,0,0,0.01);
      }

      .info-grid .cell:nth-child(even) {
        color: var(--muted);
      }

      .info-grid .row:last-child .cell {
        border-bottom: none;
      }

      .info-grid .cell:nth-child(2n) {
        border-right: none;
      }

      .tag {
        color: var(--accent);
        font-weight: 700;
      }

      .muted {
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .info-grid {
          grid-template-columns: 1fr;
        }

        .info-grid .cell {
          border-right: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div class="brand">Quay lại</div>
        <div style="display:inline-block; margin-left: 10px; font-weight:700;">đề 6</div>
      </div>

      <div class="panel">
        <h1>Xin chào đến với PTIT Rikkei DevOps Lab</h1>

        <div class="info-grid">
          <div class="row">
            <div class="cell">Họ và tên</div>
            <div class="cell">Đỗ Hồng Ký</div>
          </div>
          <div class="row">
            <div class="cell">Mã sinh viên</div>
            <div class="cell">K24CNTT3</div>
          </div>
          <div class="row">
            <div class="cell">Lớp</div>
            <div class="cell">CNTT5</div>
          </div>
          <div class="row">
            <div class="cell">Tài khoản Linux</div>
            <div class="cell"><span class="tag">dohongky-k24cntt3</span></div>
          </div>
          <div class="row">
            <div class="cell">GitHub username</div>
            <div class="cell"><span class="tag">dohongky</span></div>
          </div>
          <div class="row">
            <div class="cell">Cổng Nginx</div>
            <div class="cell">80</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
